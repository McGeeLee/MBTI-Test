name: mobile_app
description: "Multilingual MBTI mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  google_mobile_ads: ^6.0.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/data/questions_en.json
    - assets/data/questions_ko.json
    - assets/data/questions_ja.json
    - assets/data/questions_zh.json
    - assets/data/questions_vi.json
    - assets/data/types_en.json
    - assets/data/types_ko.json
    - assets/data/types_ja.json
    - assets/data/types_zh.json
    - assets/data/types_vi.json
    - assets/branding/app_icon.png
    - assets/branding/splash_image.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 23
  remove_alpha_channel_ios: true

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#CBEAFF"
  image: assets/branding/splash_image.png
  android_12:
    color: "#CBEAFF"
    image: assets/branding/app_icon.png
